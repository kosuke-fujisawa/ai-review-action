name: Retired action records CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify-records:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: npm run check
      - name: Ensure the retired custom Action is absent
        run: test ! -e action.yml && test ! -d scripts
      - name: Validate PR-Agent example configuration
        run: python3 -c "import pathlib,tomllib; tomllib.loads(pathlib.Path('examples/pr-agent.toml').read_text())"
